baseURL = "https://yejun.dev/"
title = "Yejun Su"
copyright = "&copy; 2025 Yejun Su"

disableKinds = ["taxonomy", "term"]
enableRobotsTXT = true

[module]
  [[module.imports]]
    path = "github.com/goofansu/hugo-modus"

[params]
  description = "I write all of my experiences in this blog."

[markup]
  [markup.highlight]
    noClasses = false

[menus]
  [[menus.main]]
    name = "About"
    pageRef = "/about"
    weight = 10

  [[menus.main]]
    name = "Now"
    pageRef = "/now"
    weight = 20

[services]
  [services.rss]
    limit = 30
